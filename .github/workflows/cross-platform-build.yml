name: Cross-Platform Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.8.3
  VCPKG_COMMIT: d015e31e90838a4c9dfa3eed45979bc70d9357fc

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install workflow linters
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream shellcheck
          curl --fail --location --retry 5 \
            --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz actionlint

      - name: Validate workflow and CI shell scripts
        shell: bash
        run: |
          set -euo pipefail
          ./actionlint -color
          shellcheck scripts/ci/*.sh
          appstreamcli validate --no-net resources/packaging/net.ramsbrock.BrockDJ.metainfo.xml
          cmake --list-presets=all

  build-linux-x64:
    name: Build Linux x86_64
    needs: workflow-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true

      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev libusb-1.0-0-dev \
            libtag1-dev libkeyfinder-dev librubberband-dev libsqlcipher-dev \
            libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxkbcommon-x11-dev

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-linux-x64-gcc-qt-${{ env.QT_VERSION }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'CMakePresets.json', 'vcpkg.json', '.gitmodules') }}
          restore-keys: ccache-linux-x64-gcc-qt-${{ env.QT_VERSION }}-

      - name: Show Linux x86_64 toolchain
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          cmake --version
          ninja --version
          c++ --version
          if command -v qmake6 >/dev/null 2>&1; then qmake6 -query; else qmake -query; fi

      - name: Configure
        run: cmake --preset ci-linux-x64

      - name: Build
        run: cmake --build --preset ci-linux-x64 --parallel 2

      - name: Test
        run: ctest --preset ci-linux-x64

      - name: Validate binary and headless startup
        shell: bash
        run: |
          set -euo pipefail
          file build-ci-linux-x64/bin/BrockDJ | tee binary-type.txt
          grep -Eq 'x86-64|x86_64' binary-type.txt
          build-ci-linux-x64/bin/BrockDJ --version
          QT_QPA_PLATFORM=offscreen BROCKDJ_RHI_BACKEND=auto \
            build-ci-linux-x64/bin/BrockDJ --ci-smoke-test

      - name: Stage build product
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-build-product
          tar -C build-ci-linux-x64/bin -czf ci-build-product/BrockDJ-linux-x64.tar.gz BrockDJ
          test -s ci-build-product/BrockDJ-linux-x64.tar.gz

      - name: Upload build product
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: BrockDJ-build-linux-x64
          path: ci-build-product/BrockDJ-linux-x64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  build-linux-arm64:
    name: Build Linux ARM64
    needs: workflow-lint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Qt and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev \
            qml6-module-qtqml-workerscript qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window \
            libasound2-dev libjack-jackd2-dev libusb-1.0-0-dev \
            libtag1-dev libkeyfinder-dev librubberband-dev libsqlcipher-dev \
            libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxkbcommon-x11-dev

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-linux-arm64-gcc-ubuntu2404-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'CMakePresets.json', 'vcpkg.json', '.gitmodules') }}
          restore-keys: ccache-linux-arm64-gcc-ubuntu2404-

      - name: Show Linux ARM64 toolchain
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          cmake --version
          ninja --version
          c++ --version
          if command -v qmake6 >/dev/null 2>&1; then qmake6 -query; else qmake -query; fi

      - name: Configure
        run: cmake --preset ci-linux-arm64

      - name: Build
        run: cmake --build --preset ci-linux-arm64 --parallel 2

      - name: Test
        run: ctest --preset ci-linux-arm64

      - name: Validate binary and headless startup
        shell: bash
        run: |
          set -euo pipefail
          file build-ci-linux-arm64/bin/BrockDJ | tee binary-type.txt
          grep -Eqi 'aarch64|ARM64' binary-type.txt
          build-ci-linux-arm64/bin/BrockDJ --version
          QT_QPA_PLATFORM=offscreen BROCKDJ_RHI_BACKEND=auto \
            build-ci-linux-arm64/bin/BrockDJ --ci-smoke-test

      - name: Stage build product
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-build-product
          tar -C build-ci-linux-arm64/bin -czf ci-build-product/BrockDJ-linux-arm64.tar.gz BrockDJ
          test -s ci-build-product/BrockDJ-linux-arm64.tar.gz

      - name: Upload build product
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: BrockDJ-build-linux-arm64
          path: ci-build-product/BrockDJ-linux-arm64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  build-macos:
    name: Build macOS ${{ matrix.label }}
    needs: workflow-lint
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            runner: macos-15
            cache_arch: arm64
            preset: ci-macos-arm64
            build_dir: build-ci-macos-arm64
            binary_arch: arm64
            archive: BrockDJ-macos-arm64.tar.gz
            artifact: BrockDJ-build-macos-arm64
          - label: Intel
            runner: macos-15-intel
            cache_arch: x64
            preset: ci-macos-x86_64
            build_dir: build-ci-macos-x86_64
            binary_arch: x86_64
            archive: BrockDJ-macos-x64.tar.gz
            artifact: BrockDJ-build-macos-x64
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          cache: true

      - name: Install native dependencies
        shell: bash
        run: brew install ccache ninja pkg-config taglib rubberband libkeyfinder sqlcipher

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ matrix.cache_arch }}-appleclang-qt-${{ env.QT_VERSION }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'CMakePresets.json', '.gitmodules') }}
          restore-keys: ccache-macos-${{ matrix.cache_arch }}-appleclang-qt-${{ env.QT_VERSION }}-

      - name: Generate bundle icon
        run: ./scripts/generate_icons.sh

      - name: Show macOS ${{ matrix.label }} toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          cmake --version
          ninja --version
          c++ --version
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          "$QT_ROOT_DIR/bin/qmake" -query

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Validate bundle architecture and headless startup
        shell: bash
        run: |
          set -euo pipefail
          binary=${{ matrix.build_dir }}/bin/BrockDJ.app/Contents/MacOS/BrockDJ
          lipo -archs "$binary" | tee binary-arch.txt
          grep -qw ${{ matrix.binary_arch }} binary-arch.txt
          "$binary" --version
          QT_QPA_PLATFORM=offscreen BROCKDJ_RHI_BACKEND=auto "$binary" --ci-smoke-test

      - name: Stage build product
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-build-product
          tar -C ${{ matrix.build_dir }}/bin -czf ci-build-product/${{ matrix.archive }} BrockDJ.app
          test -s ci-build-product/${{ matrix.archive }}

      - name: Upload build product
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ci-build-product/${{ matrix.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

