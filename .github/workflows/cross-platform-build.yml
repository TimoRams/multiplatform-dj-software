name: Cross-Platform Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_VERSION: 1.0.0
  HOMEBREW_NO_AUTO_UPDATE: 1

concurrency:
  group: cross-platform-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ccache (Linux)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}

      - name: Install Qt (Linux)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          modules: 'qtquick3d qtshadertools'
          arch: 'linux_gcc_64'
          cache: true

      - name: Install Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config ninja-build ccache \
            libtag1-dev librubberband-dev libasound2-dev libfftw3-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxrender-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libfuse2 \
            libvulkan-dev libgl1-mesa-dev libgles2-mesa-dev \
            libwayland-dev libwayland-egl1 libwayland-cursor0 libxcb1-dev libxcb-icccm4-dev

      - name: Install libkeyfinder (Linux)
        run: |
          git clone --depth 1 https://github.com/mixxxdj/libkeyfinder.git
          cmake -S libkeyfinder -B libkeyfinder/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build libkeyfinder/build --parallel
          sudo cmake --install libkeyfinder/build

      - name: Configure (Linux)
        run: |
          cmake -S . -B build -G Ninja

      - name: Build (Linux)
        run: |
          cmake --build build --parallel

      - name: Deploy Linux (AppImage)
        run: |
          mkdir -p deploy/AppDir/usr/bin deploy/AppDir/usr/share/applications deploy/AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/bin/BrockDJ deploy/AppDir/usr/bin/BrockDJ
          cat <<EOF > deploy/AppDir/usr/share/applications/BrockDJ.desktop
          [Desktop Entry]
          Type=Application
          Name=BrockDJ
          Exec=BrockDJ
          Icon=BrockDJ
          Categories=AudioVideo;
          EOF
          touch deploy/AppDir/usr/share/icons/hicolor/256x256/apps/BrockDJ.png
          cd deploy
          ARCH=$(uname -m)
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$ARCH.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-$ARCH.AppImage
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-$ARCH.AppImage"
          chmod +x linuxdeploy*.AppImage appimagetool-$ARCH.AppImage

          export QMAKE=$(which qmake 2>/dev/null || which qmake6)
          export QML_SOURCES_PATHS=../src/qml
          export QML_IMPORT_PATHS=$($QMAKE -query QT_INSTALL_QML)
          export EXTRA_QT_PLUGINS=wayland,xcb
          export VERSION="${APP_VERSION}"

          # Remove Qt SQL drivers that depend on unavailable system libraries
          # (libqsqlmimer needs libmimerapi.so from Mimer SQL, not in Ubuntu repos)
          QT_PLUGINS=$($QMAKE -query QT_INSTALL_PLUGINS)
          rm -f "$QT_PLUGINS/sqldrivers/libqsqlmimer.so" \
                "$QT_PLUGINS/sqldrivers/libqsqlmysql.so"

          # Bundle Qt libs, plugins and QML modules (plugin-qt may wrap the binary with a shell script)
          ./linuxdeploy-$ARCH.AppImage --appimage-extract-and-run \
              --appdir AppDir \
              -e AppDir/usr/bin/BrockDJ \
              --plugin qt

          # plugin-qt replaces the binary with a wrapper script; restore the real ELF
          # and remove any wrapper artifacts (.bin / .real) it left behind
          cp -f ../build/bin/BrockDJ AppDir/usr/bin/BrockDJ
          chmod +x AppDir/usr/bin/BrockDJ
          rm -f AppDir/usr/bin/BrockDJ.bin AppDir/usr/bin/BrockDJ.real

          # Keep Vulkan/GPU libraries dynamic so the AppImage uses the host driver stack
          find AppDir -type f \( \
            -name 'libEGL*.so*' -o -name 'libGL*.so*' -o -name 'libGLESv2*.so*' -o -name 'libglapi*.so*' \
            -o -name 'libvulkan*.so*' -o -name 'libdrm*.so*' -o -name 'libgbm*.so*' \
            -o -name 'libVkLayer*.so*' -o -name 'VkLayer_*.json' \
            -o -name 'libva*.so*' -o -name 'libva-drm*.so*' -o -name 'libva-x11*.so*' \
          \) -print0 | xargs -0 -r rm -f

          # Tell Qt where to find plugins/QML relative to the binary location
          cat <<EOF > AppDir/usr/bin/qt.conf
          [Paths]
          Prefix=..
          Plugins=plugins
          Libraries=lib
          Qml2Imports=qml
          EOF

          # Minimal AppRun — AppImage runtime always mounts at a stable path,
          # so $0's directory is always the correct AppDir root.
          cat <<'APPRUN' > AppDir/AppRun
          #!/bin/sh
          # $APPDIR is set by the AppImage type-2 runtime to the squashfs mount point.
          # Fall back to $0-based detection only when running AppRun directly.
          APPDIR="${APPDIR:-$(dirname "$(readlink -f "$0")")}"
          export LD_LIBRARY_PATH="$APPDIR/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export QT_PLUGIN_PATH="$APPDIR/usr/plugins"
          export QML2_IMPORT_PATH="$APPDIR/usr/qml"
          export QT_QPA_PLATFORM="${QT_QPA_PLATFORM:-xcb}"
          exec "$APPDIR/usr/bin/BrockDJ" "$@"
          APPRUN
          chmod +x AppDir/AppRun

          # Pack with appimagetool directly — avoids a second linuxdeploy pass
          # that would re-wrap the binary and break the AppRun → binary chain.
          ./appimagetool-$ARCH.AppImage --appimage-extract-and-run \
              AppDir "BrockDJ-linux-${ARCH}.AppImage"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrockDJ-linux-x86_64-AppImage
          path: deploy/BrockDJ-linux-*.AppImage

  build-extra-platforms:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            os: linux-arm
            artifact: linux-arm64
            package: deploy/BrockDJ-linux-*.AppImage
          - runner: macos-latest       # Apple Silicon runner
            os: macos-arm
            artifact: macos-silicon
            package: deploy/BrockDJ-macos-silicon.zip
          - runner: macos-15-intel     # Intel runner, avoids Rosetta + second Homebrew bootstrap
            os: macos-intel
            artifact: macos-intel
            package: deploy/BrockDJ-macos-intel.zip
          - runner: windows-latest
            os: windows
            artifact: windows-x64
            package: deploy/BrockDJ-windows-x64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ccache
        if: matrix.os != 'windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}

      - name: Install Qt (Linux ARM)
        if: matrix.os == 'linux-arm'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          modules: 'qtquick3d qtshadertools'
          arch: 'linux_gcc_arm64'
          cache: true

      - name: Cache vcpkg (Windows)
        if: matrix.os == 'windows'
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\.git
            C:\vcpkg\installed
            C:\vcpkg\downloads
            C:\vcpkg\packages
            C:\vcpkg\buildtrees
          key: vcpkg-windows-${{ hashFiles('**/CMakeLists.txt') }}

      - name: Install Qt (Windows)
        if: matrix.os == 'windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          modules: 'qtquick3d qtshadertools'

      - name: Install Dependencies (Linux ARM)
        if: matrix.os == 'linux-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config ninja-build ccache \
            libtag1-dev librubberband-dev libasound2-dev libfftw3-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxrender-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libfuse2 \
            libvulkan-dev libgl1-mesa-dev libgles2-mesa-dev \
            libwayland-dev libwayland-egl1 libwayland-cursor0 libxcb1-dev libxcb-icccm4-dev

      - name: Install libkeyfinder (Linux ARM)
        if: matrix.os == 'linux-arm'
        run: |
          git clone --depth 1 https://github.com/mixxxdj/libkeyfinder.git
          cmake -S libkeyfinder -B libkeyfinder/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build libkeyfinder/build --parallel
          sudo cmake --install libkeyfinder/build

      - name: Install Dependencies (macOS Apple Silicon)
        if: matrix.os == 'macos-arm'
        run: |
          brew install cmake ninja pkg-config qt@6 taglib rubberband libkeyfinder ccache

      - name: Install Dependencies (macOS Intel)
        if: matrix.os == 'macos-intel'
        run: |
          brew install cmake ninja pkg-config qt@6 taglib rubberband libkeyfinder ccache

      - name: Install Dependencies (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\vcpkg\.git')) {
            git clone https://github.com/microsoft/vcpkg C:\vcpkg
          } else {
            Write-Host "Using existing vcpkg checkout at C:\vcpkg"
          }
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg.exe install taglib rubberband libkeyfinder fftw3 --triplet x64-windows

      - name: Configure (macOS Apple Silicon)
        if: matrix.os == 'macos-arm'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Configure (macOS Intel)
        if: matrix.os == 'macos-intel'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DCMAKE_OSX_ARCHITECTURES=x86_64

      - name: Configure (Linux ARM)
        if: matrix.os == 'linux-arm'
        run: |
          cmake -S . -B build -G Ninja

      - name: Configure (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $qt6Dir = $env:Qt6_DIR
          if (-not $qt6Dir -and $env:QT_ROOT_DIR) {
            $candidate = Join-Path $env:QT_ROOT_DIR 'lib/cmake/Qt6'
            if (Test-Path (Join-Path $candidate 'Qt6Config.cmake')) {
              $qt6Dir = $candidate
            }
          }
          if (-not $qt6Dir) {
            $qtConfig = Get-ChildItem -Path $env:RUNNER_WORKSPACE -Filter Qt6Config.cmake -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($qtConfig) {
              $qt6Dir = Split-Path $qtConfig.FullName -Parent
            }
          }
          if (-not $qt6Dir) {
            throw "Could not locate Qt6_DIR from install-qt-action output."
          }
          Write-Host "Using Qt6_DIR=$qt6Dir"
          "Qt6_DIR=$qt6Dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DQt6_DIR="$qt6Dir"

      - name: Build (macOS Apple Silicon)
        if: matrix.os == 'macos-arm'
        run: cmake --build build --parallel

      - name: Build (macOS Intel)
        if: matrix.os == 'macos-intel'
        run: cmake --build build --parallel

      - name: Build (Linux ARM)
        if: matrix.os == 'linux-arm'
        run: cmake --build build --parallel

      - name: Build (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Deploy (macOS Apple Silicon)
        if: matrix.os == 'macos-arm'
        run: |
          APP="deploy/BrockDJ-silicon.app"
          BROCK_EXE="$(find build -type f -name BrockDJ -print -quit)"
          if [ -z "$BROCK_EXE" ]; then
            echo "Could not find BrockDJ executable under build directory." >&2
            exit 1
          fi
          echo "Using executable $BROCK_EXE"
          mkdir -p "$APP/Contents/MacOS"
          cp "$BROCK_EXE" "$APP/Contents/MacOS/BrockDJ"
          chmod +x "$APP/Contents/MacOS/BrockDJ"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>BrockDJ</string>
            <key>CFBundleIdentifier</key><string>net.ramsbrock.brockdj</string>
            <key>CFBundleName</key><string>BrockDJ</string>
            <key>CFBundleDisplayName</key><string>BrockDJ</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${APP_VERSION}</string>
            <key>CFBundleVersion</key><string>${APP_VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          echo "APPL????" > "$APP/Contents/PkgInfo"
          file "$APP/Contents/MacOS/BrockDJ"
          lipo -archs "$APP/Contents/MacOS/BrockDJ"
          test "$(lipo -archs "$APP/Contents/MacOS/BrockDJ")" = "arm64"
          "$(brew --prefix qt@6)/bin/macdeployqt" "$APP" -qmldir=src/qml
          ditto -c -k --sequesterRsrc --keepParent "$APP" "deploy/BrockDJ-macos-silicon.zip"

      - name: Deploy (macOS Intel)
        if: matrix.os == 'macos-intel'
        run: |
          APP="deploy/BrockDJ-intel.app"
          BROCK_EXE="$(find build -type f -name BrockDJ -print -quit)"
          if [ -z "$BROCK_EXE" ]; then
            echo "Could not find BrockDJ executable under build directory." >&2
            exit 1
          fi
          echo "Using executable $BROCK_EXE"
          mkdir -p "$APP/Contents/MacOS"
          cp "$BROCK_EXE" "$APP/Contents/MacOS/BrockDJ"
          chmod +x "$APP/Contents/MacOS/BrockDJ"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>BrockDJ</string>
            <key>CFBundleIdentifier</key><string>net.ramsbrock.brockdj</string>
            <key>CFBundleName</key><string>BrockDJ</string>
            <key>CFBundleDisplayName</key><string>BrockDJ</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${APP_VERSION}</string>
            <key>CFBundleVersion</key><string>${APP_VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          echo "APPL????" > "$APP/Contents/PkgInfo"
          file "$APP/Contents/MacOS/BrockDJ"
          lipo -archs "$APP/Contents/MacOS/BrockDJ"
          test "$(lipo -archs "$APP/Contents/MacOS/BrockDJ")" = "x86_64"
          "$(brew --prefix qt@6)/bin/macdeployqt" "$APP" -qmldir=src/qml
          ditto -c -k --sequesterRsrc --keepParent "$APP" "deploy/BrockDJ-macos-intel.zip"

      - name: Deploy (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Filter BrockDJ.exe -Recurse | Select-Object -First 1
          if (-not $exe) {
            throw "Could not find BrockDJ.exe under build directory."
          }
          Write-Host "Using executable $($exe.FullName)"
          New-Item -ItemType Directory -Force -Path deploy\BrockDJ-windows-x64
          Copy-Item $exe.FullName deploy\BrockDJ-windows-x64\BrockDJ.exe
          $qtBin = Join-Path $env:Qt6_DIR 'bin'
          $windeployqt = Join-Path $qtBin 'windeployqt.exe'
          & $windeployqt --qmldir src\qml deploy\BrockDJ-windows-x64\BrockDJ.exe
          Copy-Item "C:\vcpkg\installed\x64-windows\bin\*.dll" -Destination deploy\BrockDJ-windows-x64\
          Compress-Archive -Path deploy\BrockDJ-windows-x64 -DestinationPath deploy\BrockDJ-windows-x64.zip -Force

      - name: Deploy (Linux ARM)
        if: matrix.os == 'linux-arm'
        run: |
          mkdir -p deploy/AppDir/usr/bin deploy/AppDir/usr/share/applications deploy/AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/bin/BrockDJ deploy/AppDir/usr/bin/BrockDJ
          cat <<EOF > deploy/AppDir/usr/share/applications/BrockDJ.desktop
          [Desktop Entry]
          Type=Application
          Name=BrockDJ
          Exec=BrockDJ
          Icon=BrockDJ
          Categories=AudioVideo;
          EOF
          touch deploy/AppDir/usr/share/icons/hicolor/256x256/apps/BrockDJ.png
          cd deploy
          ARCH=$(uname -m)
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$ARCH.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-$ARCH.AppImage
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-$ARCH.AppImage"
          chmod +x linuxdeploy*.AppImage appimagetool-$ARCH.AppImage

          export QMAKE=$(which qmake 2>/dev/null || which qmake6)
          export QML_SOURCES_PATHS=../src/qml
          export QML_IMPORT_PATHS=$($QMAKE -query QT_INSTALL_QML)
          export EXTRA_QT_PLUGINS=wayland,xcb
          export VERSION="${APP_VERSION}"

          QT_PLUGINS=$($QMAKE -query QT_INSTALL_PLUGINS)
          rm -f "$QT_PLUGINS/sqldrivers/libqsqlmimer.so" \
                "$QT_PLUGINS/sqldrivers/libqsqlmysql.so"

          ./linuxdeploy-$ARCH.AppImage --appimage-extract-and-run \
              --appdir AppDir \
              -e AppDir/usr/bin/BrockDJ \
              --plugin qt

          cp -f ../build/bin/BrockDJ AppDir/usr/bin/BrockDJ
          chmod +x AppDir/usr/bin/BrockDJ
          rm -f AppDir/usr/bin/BrockDJ.bin AppDir/usr/bin/BrockDJ.real

          find AppDir -type f \( \
            -name 'libEGL*.so*' -o -name 'libGL*.so*' -o -name 'libGLESv2*.so*' -o -name 'libglapi*.so*' \
            -o -name 'libvulkan*.so*' -o -name 'libdrm*.so*' -o -name 'libgbm*.so*' \
            -o -name 'libVkLayer*.so*' -o -name 'VkLayer_*.json' \
            -o -name 'libva*.so*' -o -name 'libva-drm*.so*' -o -name 'libva-x11*.so*' \
          \) -print0 | xargs -0 -r rm -f

          cat <<EOF > AppDir/usr/bin/qt.conf
          [Paths]
          Prefix=..
          Plugins=plugins
          Libraries=lib
          Qml2Imports=qml
          EOF

          cat <<'APPRUN' > AppDir/AppRun
          #!/bin/sh
          # $APPDIR is set by the AppImage type-2 runtime to the squashfs mount point.
          # Fall back to $0-based detection only when running AppRun directly.
          APPDIR="${APPDIR:-$(dirname "$(readlink -f "$0")")}"
          export LD_LIBRARY_PATH="$APPDIR/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export QT_PLUGIN_PATH="$APPDIR/usr/plugins"
          export QML2_IMPORT_PATH="$APPDIR/usr/qml"
          export QT_QPA_PLATFORM="${QT_QPA_PLATFORM:-xcb}"
          exec "$APPDIR/usr/bin/BrockDJ" "$@"
          APPRUN
          chmod +x AppDir/AppRun

          ./appimagetool-$ARCH.AppImage --appimage-extract-and-run \
              AppDir "BrockDJ-linux-${ARCH}.AppImage"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrockDJ-${{ matrix.artifact }}
          path: ${{ matrix.package }}
