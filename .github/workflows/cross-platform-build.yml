name: Cross-Platform Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.8.3
  VCPKG_COMMIT: d015e31e90838a4c9dfa3eed45979bc70d9357fc
  PACKAGE_ARTIFACTS: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install workflow linters
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream shellcheck
          curl --fail --location --retry 5 \
            --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz actionlint

      - name: Validate workflow, scripts and presets
        shell: bash
        run: |
          set -euo pipefail
          ./actionlint -color
          shellcheck scripts/ci/*.sh scripts/generate_icons.sh
          appstreamcli validate --no-net resources/packaging/net.ramsbrock.BrockDJ.metainfo.xml
          cmake --list-presets=all

  build-linux:
    name: Linux ${{ matrix.label }}
    needs: workflow-lint
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64
            runner: ubuntu-24.04
            cache_arch: x64
            preset: ci-linux-x64
            build_dir: build-ci-linux-x64
            binary_arch: 'x86-64|x86_64'
            output: BrockDJ-Linux-x64.AppImage
            artifact: BrockDJ-linux-x86_64-AppImage
          - label: ARM64
            runner: ubuntu-24.04-arm
            cache_arch: arm64
            preset: ci-linux-arm64
            build_dir: build-ci-linux-arm64
            binary_arch: 'aarch64|ARM64'
            output: BrockDJ-Linux-ARM64.AppImage
            artifact: BrockDJ-linux-arm64-AppImage
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Qt
        if: matrix.cache_arch == 'x64'
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true

      - name: Install native and packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache cmake curl desktop-file-utils file imagemagick \
            libasound2-dev libfftw3-dev libfontconfig1-dev libfreetype6-dev \
            libgl1-mesa-dev libjack-jackd2-dev libsqlcipher-dev libtag1-dev \
            librubberband-dev librsvg2-bin libusb-1.0-0-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxkbcommon-x11-dev libxrandr-dev libxrender-dev \
            ninja-build pkg-config patchelf
          if [[ "${{ matrix.cache_arch }}" == arm64 ]]; then
            sudo apt-get install -y --no-install-recommends \
              qt6-base-dev qt6-declarative-dev \
              qml6-module-qtqml-workerscript qml6-module-qtquick \
              qml6-module-qtquick-controls qml6-module-qtquick-layouts \
              qml6-module-qtquick-window
          fi

      - name: Build pinned libkeyfinder with FFTW3
        shell: bash
        run: ./scripts/ci/install-libkeyfinder.sh /usr/local

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ matrix.cache_arch }}-gcc-qt-${{ env.QT_VERSION }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'CMakePresets.json', 'vcpkg.json', '.gitmodules') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-linux-${{ matrix.cache_arch }}-gcc-qt-${{ env.QT_VERSION }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'CMakePresets.json', 'vcpkg.json', '.gitmodules') }}-
            ccache-linux-${{ matrix.cache_arch }}-gcc-qt-${{ env.QT_VERSION }}-

      - name: Generate platform icons
        run: ./scripts/generate_icons.sh

      - name: Show Linux toolchain
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          cmake --version
          ninja --version
          c++ --version
          if command -v qmake6 >/dev/null 2>&1; then qmake6 -query; else qmake -query; fi

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2

      - name: Test
        id: ctest
        run: ctest --preset ${{ matrix.preset }}

      - name: Validate architecture and headless startup
        shell: bash
        run: |
          set -euo pipefail
          binary="${{ matrix.build_dir }}/bin/BrockDJ"
          file "$binary" | tee binary-type.txt
          grep -Eqi '${{ matrix.binary_arch }}' binary-type.txt
          "$binary" --version
          QT_QPA_PLATFORM=offscreen BROCKDJ_RHI_BACKEND=auto \
            "$binary" --ci-smoke-test

      - name: Build and smoke-test AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ./scripts/ci/package-appimage.sh \
            "${{ matrix.build_dir }}/bin/BrockDJ" "dist/${{ matrix.output }}"

      - name: Upload failed Linux test diagnostics
        if: ${{ failure() && steps.ctest.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ matrix.artifact }}
          path: ${{ matrix.build_dir }}/Testing/Temporary/*.log
          if-no-files-found: error

      - name: Upload Linux package
        if: env.PACKAGE_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error
          compression-level: 0

  build-macos:
    name: macOS ${{ matrix.label }}
    needs: workflow-lint
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            runner: macos-15
            cache_arch: arm64
            preset: ci-macos-arm64
            build_dir: build-ci-macos-arm64
            binary_arch: arm64
            package_arch: arm64
            output: BrockDJ-macOS-Apple-Silicon.zip
            artifact: BrockDJ-macos-arm64
          - label: Intel
            runner: macos-15-intel
            cache_arch: x64
            preset: ci-macos-x86_64
            build_dir: build-ci-macos-x86_64
            binary_arch: x86_64
            package_arch: x86_64
            output: BrockDJ-macOS-Intel.zip
            artifact: BrockDJ-macos-x86_64
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          cache: true

      - name: Install native and deployment dependencies
        run: brew install ccache dylibbundler imagemagick libkeyfinder librsvg ninja pkg-config rubberband sqlcipher taglib

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ matrix.cache_arch }}-appleclang-qt-${{ env.QT_VERSION }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'CMakePresets.json', '.gitmodules') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-macos-${{ matrix.cache_arch }}-appleclang-qt-${{ env.QT_VERSION }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'CMakePresets.json', '.gitmodules') }}-
            ccache-macos-${{ matrix.cache_arch }}-appleclang-qt-${{ env.QT_VERSION }}-

      - name: Generate platform icons
        run: ./scripts/generate_icons.sh

      - name: Show macOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          cmake --version
          ninja --version
          c++ --version
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          "$QT_ROOT_DIR/bin/qmake" -query

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2

      - name: Test
        id: ctest
        run: ctest --preset ${{ matrix.preset }}

      - name: Validate architecture and headless startup
        shell: bash
        run: |
          set -euo pipefail
          binary="${{ matrix.build_dir }}/bin/BrockDJ.app/Contents/MacOS/BrockDJ"
          lipo -archs "$binary" | tee binary-arch.txt
          grep -qw "${{ matrix.binary_arch }}" binary-arch.txt
          "$binary" --version
          QT_QPA_PLATFORM=offscreen BROCKDJ_RHI_BACKEND=auto \
            "$binary" --ci-smoke-test

      - name: Deploy and smoke-test macOS package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ./scripts/ci/package-macos.sh \
            "${{ matrix.build_dir }}/bin/BrockDJ.app" \
            "${{ matrix.package_arch }}" "dist/${{ matrix.output }}"

      - name: Upload failed macOS test diagnostics
        if: ${{ failure() && steps.ctest.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ matrix.artifact }}
          path: ${{ matrix.build_dir }}/Testing/Temporary/*.log
          if-no-files-found: error

      - name: Upload macOS package
        if: env.PACKAGE_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error
          compression-level: 0

  build-windows:
    name: Windows x64
    needs: workflow-lint
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg-pinned
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check out pinned vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: vcpkg-pinned

      - name: Install icon generation tools
        shell: pwsh
        run: |
          choco install inkscape imagemagick --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Icon tool installation failed with exit code $LASTEXITCODE" }
          $inkscapePath = Join-Path $env:ProgramFiles 'Inkscape\bin'
          if (Test-Path $inkscapePath) { Add-Content $env:GITHUB_PATH $inkscapePath }
          $magickDir = Get-ChildItem $env:ProgramFiles -Directory -Filter 'ImageMagick*' |
            Select-Object -First 1
          if ($magickDir -and (Test-Path (Join-Path $magickDir.FullName 'magick.exe'))) {
            Add-Content $env:GITHUB_PATH $magickDir.FullName
          }

      - name: Generate platform icons
        shell: pwsh
        run: |
          bash ./scripts/generate_icons.sh
          if ($LASTEXITCODE -ne 0) { throw "Icon generation failed with exit code $LASTEXITCODE" }

      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Restore pinned vcpkg path
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = Join-Path $env:GITHUB_WORKSPACE 'vcpkg-pinned'
          "VCPKG_ROOT=$env:VCPKG_ROOT" >> $env:GITHUB_ENV
          if (-not (Test-Path (Join-Path $env:VCPKG_ROOT 'bootstrap-vcpkg.bat'))) {
            throw "Pinned vcpkg checkout is missing from $env:VCPKG_ROOT"
          }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: vcpkg-binary-cache
          key: vcpkg-windows-x64-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-x64-${{ env.VCPKG_COMMIT }}-

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = Join-Path $env:GITHUB_WORKSPACE 'vcpkg-pinned'
          $bootstrap = Join-Path $env:GITHUB_WORKSPACE 'vcpkg-pinned\bootstrap-vcpkg.bat'
          & $bootstrap -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed with exit code $LASTEXITCODE" }

      - name: Show Windows toolchain
        shell: pwsh
        run: |
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'x64') {
            throw "Expected x64 MSVC environment, got '$env:VSCMD_ARG_TGT_ARCH'"
          }
          cl.exe /?
          if ($LASTEXITCODE -ne 0) { throw "cl.exe failed with exit code $LASTEXITCODE" }
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw "cmake --version failed with exit code $LASTEXITCODE" }
          ninja --version
          if ($LASTEXITCODE -ne 0) { throw "ninja --version failed with exit code $LASTEXITCODE" }
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "Qt6_DIR=$env:Qt6_DIR"
          Write-Host "QT_ROOT_DIR=$env:QT_ROOT_DIR"
          & (Join-Path $env:QT_ROOT_DIR 'bin\qmake.exe') -query
          if ($LASTEXITCODE -ne 0) { throw "qmake -query failed with exit code $LASTEXITCODE" }

      - name: Configure
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = Join-Path $env:GITHUB_WORKSPACE 'vcpkg-pinned'
          cmake --preset ci-windows-x64
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed with exit code $LASTEXITCODE" }

      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset ci-windows-x64 --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed with exit code $LASTEXITCODE" }

      - name: Test
        id: ctest
        shell: pwsh
        run: |
          ctest --preset ci-windows-x64
          if ($LASTEXITCODE -ne 0) { throw "CTest failed with exit code $LASTEXITCODE" }

      - name: Validate architecture and headless startup
        shell: pwsh
        run: |
          $binary = 'build-ci-windows-x64/bin/BrockDJ.exe'
          $headers = & dumpbin.exe /nologo /headers $binary
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed with exit code $LASTEXITCODE" }
          if (-not ($headers | Select-String -Quiet '8664 machine \(x64\)')) {
            throw 'BrockDJ.exe is not an x64 executable'
          }
          $env:PATH = "$env:GITHUB_WORKSPACE\build-ci-windows-x64\vcpkg_installed\x64-windows\bin;$env:PATH"
          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw "BrockDJ --version failed with exit code $LASTEXITCODE" }
          $env:QT_QPA_PLATFORM = 'offscreen'
          & $binary --ci-smoke-test
          if ($LASTEXITCODE -ne 0) { throw "BrockDJ smoke test failed with exit code $LASTEXITCODE" }

      - name: Deploy and smoke-test Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          ./scripts/ci/package-windows.ps1 `
            -Executable build-ci-windows-x64/bin/BrockDJ.exe `
            -VcpkgBin build-ci-windows-x64/vcpkg_installed/x64-windows/bin `
            -QmlDir src/qml `
            -Output dist/BrockDJ-Windows-x64.zip
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging failed with exit code $LASTEXITCODE" }

      - name: Upload failed Windows test diagnostics
        if: ${{ failure() && steps.ctest.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-BrockDJ-windows-x86_64
          path: build-ci-windows-x64/Testing/Temporary/*.log
          if-no-files-found: error

      - name: Upload Windows package
        if: env.PACKAGE_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: BrockDJ-windows-x86_64
          path: dist/BrockDJ-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  linux-sanitizers:
    name: Linux x86_64 ASan and UBSan
    needs: workflow-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true

      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache imagemagick libasound2-dev libfftw3-dev libfontconfig1-dev \
            libfreetype6-dev libgl1-mesa-dev libjack-jackd2-dev librsvg2-bin \
            libsqlcipher-dev libtag1-dev librubberband-dev libusb-1.0-0-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxkbcommon-x11-dev libxrandr-dev libxrender-dev \
            ninja-build pkg-config
          ./scripts/ci/install-libkeyfinder.sh /usr/local

      - name: Generate platform icons
        run: ./scripts/generate_icons.sh

      - name: Configure
        run: cmake --preset ci-linux-sanitizers

      - name: Build
        run: |
          cmake --build --preset ci-linux-sanitizers --parallel 2 --target \
            BrockDJ \
            BrockDJ_smoke_tests \
            BrockDJ_deck_audio_graph_tests \
            BrockDJ_audio_page_cache_tests \
            BrockDJ_scratch_cache_tests \
            BrockDJ_cached_playback_tests \
            BrockDJ_waveform_cache_repair_tests \
            BrockDJ_scratch_motion_tests \
            BrockDJ_waveform_motion_tests \
            BrockDJ_control_clock_tests \
            BrockDJ_neutral_waveform_analysis_tests \
            BrockDJ_database_worker_tests \
            BrockDJ_media_io_scheduler_tests

      - name: Test
        run: ctest --preset ci-linux-sanitizers --no-tests=error

      - name: Smoke-test application startup and shutdown
        env:
          QT_QPA_PLATFORM: offscreen
          BROCKDJ_RHI_BACKEND: auto
        run: build-ci-linux-sanitizers/bin/BrockDJ --ci-smoke-test
