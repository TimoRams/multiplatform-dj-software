  package-linux-x64:
    name: Package Linux x86_64 AppImage
    needs: build-linux-x64
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out packaging files
        uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true

      - name: Install packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl file patchelf desktop-file-utils \
            libasound2 libjack-jackd2-0 libusb-1.0-0 \
            libtag1v5 libkeyfinder2 librubberband2 \
            libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxkbcommon-x11-dev

      - name: Download build product
        uses: actions/download-artifact@v8
        with:
          name: BrockDJ-build-linux-x64
          path: ci-build-product

      - name: Build and smoke-test AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unpacked dist
          tar -C unpacked -xzf ci-build-product/BrockDJ-linux-x64.tar.gz
          ./scripts/ci/package-appimage.sh \
            unpacked/BrockDJ dist/BrockDJ-Linux-x64.AppImage

      - name: Upload Linux x86_64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: BrockDJ-linux-x86_64-AppImage
          path: dist/BrockDJ-Linux-x64.AppImage
          if-no-files-found: error
          compression-level: 0

  package-linux-arm64:
    name: Package Linux ARM64 AppImage
    needs: build-linux-arm64
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - name: Check out packaging files
        uses: actions/checkout@v6

      - name: Install Qt and packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl file patchelf desktop-file-utils \
            qt6-base-dev qt6-declarative-dev \
            qml6-module-qtqml-workerscript qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window \
            libasound2 libjack-jackd2-0 libusb-1.0-0 \
            libtag1v5 libkeyfinder2 librubberband2 \
            libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxkbcommon-x11-dev

      - name: Download build product
        uses: actions/download-artifact@v8
        with:
          name: BrockDJ-build-linux-arm64
          path: ci-build-product

      - name: Build and smoke-test AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unpacked dist
          tar -C unpacked -xzf ci-build-product/BrockDJ-linux-arm64.tar.gz
          ./scripts/ci/package-appimage.sh \
            unpacked/BrockDJ dist/BrockDJ-Linux-ARM64.AppImage

      - name: Upload Linux ARM64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: BrockDJ-linux-arm64-AppImage
          path: dist/BrockDJ-Linux-ARM64.AppImage
          if-no-files-found: error
          compression-level: 0

  package-macos:
    name: Package macOS ${{ matrix.label }}
    needs: build-macos
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            runner: macos-15
            build_artifact: BrockDJ-build-macos-arm64
            archive: BrockDJ-macos-arm64.tar.gz
            package_arch: arm64
            output: BrockDJ-macOS-Apple-Silicon.zip
            artifact: BrockDJ-macos-arm64
          - label: Intel
            runner: macos-15-intel
            build_artifact: BrockDJ-build-macos-x64
            archive: BrockDJ-macos-x64.tar.gz
            package_arch: x86_64
            output: BrockDJ-macOS-Intel.zip
            artifact: BrockDJ-macos-x86_64
    steps:
      - name: Check out packaging files
        uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          cache: true

      - name: Install deployment dependencies
        run: brew install dylibbundler taglib rubberband libkeyfinder sqlcipher

      - name: Download build product
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.build_artifact }}
          path: ci-build-product

      - name: Deploy, sign and smoke-test app bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unpacked dist
          tar -C unpacked -xzf ci-build-product/${{ matrix.archive }}
          ./scripts/ci/package-macos.sh \
            unpacked/BrockDJ.app ${{ matrix.package_arch }} dist/${{ matrix.output }}

      - name: Upload macOS ${{ matrix.label }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error
          compression-level: 0

